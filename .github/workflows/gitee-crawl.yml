name: Gitee Crawler

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击 Run workflow 启动
  schedule: # 每日定时增量续爬（UTC 21:00，即北京时间 05:00）
    - cron: "0 21 * * *"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 略小于 GitHub Actions 6 小时上限

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Gitee Crawler
        env:
          GITEE_TOKENS: ${{ secrets.GITEE_TOKENS }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 启动后台自动提交守护进程，每 25 分钟提交一次数据，双重保险防强杀
          (
            while true; do
              sleep 1500
              echo "=== 启动 25分钟 自动进度备份 ==="
              git add "02-原始数据" modelscope_output
              git commit -m "gitee 自动备份最新爬取进度 [skip ci]" 2>/dev/null || true
              git pull --rebase 2>/dev/null || true
              git push 2>/dev/null || echo "当前无新数据可备份"
            done
          ) &
          AUTO_COMMIT_PID=$!

          # 运行爬虫（断点续传 + 能力探测）
          python crawl_gitee.py --since 2020-01-01

          # 运行结束后终止后台进程
          kill $AUTO_COMMIT_PID || true

      - name: Generate Progress Report
        if: always()
        run: python gen_progress.py

      - name: Commit and Push Progress
        if: always() # 无论正常结束还是由于超时安全退出，都提交保存进度
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "02-原始数据" modelscope_output PROGRESS.md
          git commit -m "保存 gitee 爬取数据与断点状态 [skip ci]" || echo "没有检测到任何更新"
          git pull --rebase 2>/dev/null || true
          git push || echo "推送失败或无更新"
