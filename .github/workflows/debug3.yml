name: Debug3 Connectivity

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Gitee API
        run: |
          curl -sS -o /dev/null -w "repos: HTTP %{http_code} total %{time_total}s\n" \
            "https://gitee.com/api/v5/repos/mindspore/mindspore" -m 30
