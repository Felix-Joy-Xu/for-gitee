name: Debug Connectivity

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Gitee API with token
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          echo "=== token issue pages (per_page=100) ==="
          for p in 1 2 5 10; do
            echo "--- page $p ---"
            curl -sS -o /tmp/out.json -w "HTTP %{http_code} %{time_total}s size=%{size_download}\n" \
              "https://gitee.com/api/v5/repos/mindspore/mindspore/issues?access_token=${GITEE_TOKEN}&state=all&since=2020-01-01&per_page=100&page=${p}" -m 60 \
              -D /tmp/hdr.txt || echo "page $p FAILED"
            head -3 /tmp/hdr.txt | grep -i rate || true
          done
          echo "=== python requests simulation ==="
          python3 - <<'EOF'
import json, time, urllib.request
import os
token = os.environ["GITEE_TOKEN"]
for page in (1, 2):
    t0 = time.time()
    url = f"https://gitee.com/api/v5/repos/mindspore/mindspore/issues?access_token={token}&state=all&since=2020-01-01&per_page=100&page={page}"
    try:
        with urllib.request.urlopen(url, timeout=60) as r:
            data = json.load(r)
            print(f"page {page}: HTTP {r.status} items={len(data)} in {time.time()-t0:.1f}s")
            print("  rate headers:", {k: r.headers.get(k) for k in ("X-RateLimit-Remaining","X-RateLimit-Limit")})
    except Exception as e:
        print(f"page {page}: ERROR {e} in {time.time()-t0:.1f}s")
EOF
